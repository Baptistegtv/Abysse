name: Compiler Abysse (3dsx)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Diagnostic environnement
        run: |
          echo "=== devkitARM bin (gcc/ld) ==="
          ls $DEVKITARM/bin | grep -iE "gcc|^ld"
          echo "=== Extrait 3ds_rules (regle de link) ==="
          grep -n -A3 '$(OUTPUT).elf' $DEVKITARM/3ds_rules || true
          grep -n '^LD\|^CC' $DEVKITARM/3ds_rules || true

      - name: Compiler avec make (verbose)
        run: |
          make V=1

      - name: Uploader le fichier .3dsx genere
        uses: actions/upload-artifact@v4
        with:
          name: abysse-3dsx
          path: "*.3dsx"
